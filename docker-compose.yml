services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: mobility_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mobility}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mobility}
      POSTGRES_DB: ${POSTGRES_DB:-mobility}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mobility}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
